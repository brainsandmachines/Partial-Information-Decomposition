# Cross-decomposition dimensionality: permutation significance vs reconstruction.
# Relative paths resolve from the repository root.

# Choose "synthetic" to retain the known-rank validation or "otc" to load one
# subject's repeated OTC responses. Both routes expose the first two repetitions
# through the authors' split_by_repetition adapter without averaging or scaling.
data:
  source: otc
  n_repetitions: 2

  synthetic:
    n_images: 100
    n_voxels: 50
    true_rank: 5
    n_repeats: 4
    seed: 0
    noise_scale: 0.5

  # Keep image_set=unique when the shared1000 images are reserved for final
  # evaluation. These paths are available on the Golan cluster.
  otc:
    subject: subj01
    image_set: unique
    neural_data_dir: /groups/golan_neurogroup/bml_group/datasets/nsddata/otc_betas/otc_betas_img_vox_rep/
    pkl_info_path: /groups/golan_neurogroup/bml_group/datasets/nsddata/nsddata/experiments/nsd/nsd_stim_info_merged.pkl

# Authors' within-subject inputs (Figure 3): repetition 0 versus repetition 1.
cross_decomposition:
  n_folds: 8
  # The authors use one seed for the fold assignment and the permutations.
  seed: 0
  # Figure 3 used the exact SVD (randomized: false) on GPU. In the installed
  # dependency, that path fails on CPU inside _svd_flip, so true is the current
  # CPU-compatible setting. Use false on a compatible GPU when reproducing the
  # authors' exact setting. Randomization does not cap the OTC voxel dimensions.
  randomized: true

# Reconstruction-error selection is not implemented by the authors. It is a
# separate diagnostic for synthetic or OTC data; false skips it entirely.
# On OTC the current per-k loop is slow (thousands of candidate ranks).
reconstruction:
  enabled: true

# Figure 3 settings: 5,000 permutations, p < 0.001, 3 bins per decade over
# ranks 1-10,000.
permutation:
  n_permutations: 5000
  null_quantile: 0.999
  bin_density: 3
  bin_stop: 10000
  batch_size: 10

# --smoke replaces n_permutations with this value and writes to a smoke folder.
smoke_n_permutations: 200

output_dir: simulation_results/cross_decomposition_criteria
