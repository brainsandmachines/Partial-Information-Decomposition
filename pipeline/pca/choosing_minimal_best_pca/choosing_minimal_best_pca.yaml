# Selection functions are resolved from
# choosing_minimal_best_pca.SELECTION_FUNCTIONS.
functions:
  selection_function: gsn_independent_repeat

subjects:
  - subj01

# "unique": every image except shared1000; "all": the full OTC data set.
# Shared images are used only when this is set to "all".
image_set: unique

# Repeated responses (image, voxel, repeat). pkl_info_path holds the
# shared1000 flags and is read only when image_set is "unique".
neural_data_dir: /groups/golan_neurogroup/bml_group/datasets/nsddata/otc_betas/otc_betas_img_vox_rep/
pkl_info_path: /groups/golan_neurogroup/bml_group/datasets/nsddata/nsddata/experiments/nsd/nsd_stim_info_merged.pkl

# Relative paths are resolved from the repository root (git-ignored folder).
output_dir: pipeline/pca/results/choosing_minimal_best_pca

# Passed to the selection function as keyword arguments.
selection_kwargs:
  max_components: 1000  # Same cap as subject_pca.max_features; null tests every voxel (slow).
  n_folds: 5
  seed: 0
  # "input_repeat_count": 2/3 total weight for two-repeat inputs and 1/3
  # for one-repeat inputs when three repeats are available; "equal": 1/2 each.
  repeat_split_weighting: input_repeat_count
