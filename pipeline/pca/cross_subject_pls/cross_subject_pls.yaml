# Cross-subject PLS rank selection on the shared images.
# The source subject's repeat-averaged OTC responses predict the target
# subject's responses; only images seen by both subjects (shared1000) are used.

source_subject: subj01
target_subject: subj02

hdf_path: /groups/golan_neurogroup/bml_group/datasets/nsddata/nsddata_stimuli/stimuli/nsd/nsd_stimuli.hdf5
pkl_info_path: /groups/golan_neurogroup/bml_group/datasets/nsddata/nsddata/experiments/nsd/nsd_stim_info_merged.pkl
# Repeat-averaged responses: {subject}_OTC_betas_per_stimulus.zarr
neural_data_dir: /groups/golan_neurogroup/bml_group/datasets/nsddata/otc_betas/otc_betas_per_stim/

# Ranks 0..max_rank are tested; max_rank must be below the training images per
# fold (about 800 with 1000 shared images and 5 folds).
max_rank: 300
n_folds: 5
seed: 0

# Relative paths resolve from the repository root (git-ignored folder).
output_dir: pipeline/pca/results/cross_subject_pls
