# Reuse subjects, OTC paths, image_set, seed, folds, weighting, and K cap verbatim.
# Relative paths resolve from the repository root. No argparse is used.
gsn_config_path: pipeline/pca/choosing_minimal_best_pca/choosing_minimal_best_pca.yaml

# Each execution creates a fresh subject/image-set/seed/timestamp subdirectory.
output_dir: pipeline/pca/results/cross_decomposition_comparison

# auto: matrix-free truncated SVD for small K, exact reduced-QR SVD otherwise.
# exact is useful for small verification runs; iterative requires K < n_voxels.
svd_solver: auto
